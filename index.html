<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTE Engine İndirici</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #ffffff; }
        p { color: #aaaaaa; margin-bottom: 25px; }
        .install-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .install-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PTE Engine</h1>
        <p>Motor dosyasını sisteminize hemen indirin.</p>
        <button id="downloadBtn" class="install-btn">Install PTE Engine</button>
    </div>

    <script>
        // Senin verdiğin pteEngine.py kodunun birebir içeriği
        const pythonCode = `import installprogram

sin = input(">>")
if sin == "install":
    installprogram.install(program)
    print("ProgramInstalled")
`;

        // Butona tıklandığında dosyayı dinamik olarak oluşturan ve indiren mekanizma
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const blob = new Blob([pythonCode], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pteEngine.py'; // Tam istediğin dosya adı
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>

</body>
</html>
